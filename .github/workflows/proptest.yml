name: "Property Tests"

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  proptest:
    if: contains(github.event.pull_request.labels.*.name, 'proptest')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: git checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@fb51252c7ba57d633bc668f941da052e410add48 # v1.13.0
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-proptest-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-proptest-
            ${{ runner.os }}-cargo-

      - name: Run integration tests (proptest-driven)
        id: proptest
        continue-on-error: true
        run: cargo test --test fuzz_idl_parsing

      - name: Label PR on proptest failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ steps.proptest.outcome }}" = "failure" ]; then
            gh pr edit "$PR_NUMBER" --add-label proptest-failure || true
          else
            gh pr edit "$PR_NUMBER" --remove-label proptest-failure || true
          fi
