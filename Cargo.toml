[package]
name = "solana_parser"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4.22"
# Split Anza crates instead of solana-sdk / solana-program 2.x: those pull
# solana-secp256r1-program -> openssl-sys and do not build for iOS.
solana-hash = { version = "4.7.0", default-features = false }
solana-message = { version = "6.0.0", features = ["serde"] }
solana-pubkey = { version = "4.4.0" }
solana-system-interface = { version = "3.3.0", features = ["bincode"] }
bincode = "1.3.3"
hex = "0.4.3"
serde_json = "1.0"
solana_idl = "0.2.0"
serde = "1.0.219"
sha2 = { version = "0.10.8", default-features = false }
byteorder = "1.5.0"
bs58 = "0.5.1"
heck = "0.5.0"

[dev-dependencies]
# Test code builds messages with VersionedMessage::serialize and Hash::new_unique.
solana-message = { version = "6.0.0", features = ["serde", "wincode"] }
solana-hash = { version = "4.7.0", default-features = false, features = ["atomic"] }
